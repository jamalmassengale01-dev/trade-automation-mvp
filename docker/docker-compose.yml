services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: trade-automation-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # No default. A trading database reachable on a public box with the
      # password 'postgres' is not a hypothetical mistake.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
      POSTGRES_DB: trade_automation
    # Bound to loopback deliberately. On a VPS, "5432:5432" publishes the
    # database to the internet on an interface most firewalls leave open.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis (for BullMQ)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: trade-automation-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # Backend API
  # ============================================
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: trade-automation-api
    restart: unless-stopped
    # Everything below is read from a .env file next to this compose file.
    # Values are NOT defaulted where a wrong default would be dangerous: an
    # unset WEBHOOK_SECRET or SYSTEM_API_KEY should fail loudly rather than
    # quietly run a public endpoint on a placeholder.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      # Container-internal hostnames — these are the only two that must not
      # come from .env, because they name services in this compose network.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/trade_automation
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../logs:/app/logs

  # ============================================
  # Frontend (Next.js)
  # ============================================
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        # Browser-reachable, and baked in at build time — see Dockerfile.web.
        # Local: http://localhost:3001. Deployed: https://api.yourdomain.com.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: trade-automation-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

  # ============================================
  # Caddy — HTTPS termination
  # ============================================
  # Optional: `docker compose --profile public up -d`.
  #
  # TradingView will not POST to a bare IP or to plain HTTP, and Stripe
  # requires HTTPS for webhook endpoints, so a public deployment needs TLS.
  # Caddy obtains and renews Let's Encrypt certificates automatically, which
  # is one fewer thing to remember in ninety days.
  #
  # Ports 3000/3001 stay published for local access during setup. Close them
  # in the host firewall once Caddy is serving; see docs/DEPLOY.md.
  caddy:
    image: caddy:2-alpine
    container_name: trade-automation-caddy
    restart: unless-stopped
    profiles: ["public"]
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
