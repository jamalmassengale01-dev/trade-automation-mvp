services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: trade-automation-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # No default. A trading database reachable on a public box with the
      # password 'postgres' is not a hypothetical mistake.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
      POSTGRES_DB: trade_automation
    # Bound to loopback deliberately. On a VPS, "5432:5432" publishes the
    # database to the internet on an interface most firewalls leave open.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis (for BullMQ)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: trade-automation-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # Backend API
  # ============================================
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: trade-automation-api
    restart: unless-stopped
    # Everything below is read from a .env file next to this compose file.
    # Values are NOT defaulted where a wrong default would be dangerous: an
    # unset WEBHOOK_SECRET or SYSTEM_API_KEY should fail loudly rather than
    # quietly run a public endpoint on a placeholder.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      # Container-internal hostnames — these are the only two that must not
      # come from .env, because they name services in this compose network.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/trade_automation
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Loopback only, for the same reason as Postgres and Redis above — and for
    # one extra reason that catches people out: DOCKER BYPASSES UFW. Docker
    # writes its own iptables rules into the DOCKER chain, which is traversed
    # before ufw's INPUT chain, so "3001:3001" is reachable from the internet
    # even though ufw allows nothing but 22, 80 and 443. Closing the port in
    # the firewall does not close it.
    #
    # Nothing outside needs this port anyway: Caddy reaches the API over the
    # compose network as api:3001. Publishing it to 0.0.0.0 exposed the webhook
    # endpoint and every API route over plain HTTP, bypassing the TLS that was
    # just set up. An SSH tunnel still works against 127.0.0.1.
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      # 127.0.0.1, NOT localhost. Node listens on 0.0.0.0, which is IPv4 only,
      # but inside the container `localhost` resolves to ::1 first and busybox
      # wget connects there — "connection refused", forever, while the server
      # serves every real request perfectly. A healthcheck that is always red
      # is worse than none: it is the one you learn to ignore.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../logs:/app/logs

  # ============================================
  # Frontend (Next.js)
  # ============================================
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        # Browser-reachable, and baked in at build time — see Dockerfile.web.
        # Local: http://localhost:3001. Deployed: https://api.yourdomain.com.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: trade-automation-web
    restart: unless-stopped
    # Loopback only — see the note on the api service. Caddy proxies to
    # web:3000 over the compose network; the host port exists for SSH tunnels
    # during setup, not for the public.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  # ============================================
  # Caddy — HTTPS termination
  # ============================================
  # Optional: `docker compose --profile public up -d`.
  #
  # TradingView will not POST to a bare IP or to plain HTTP, and Stripe
  # requires HTTPS for webhook endpoints, so a public deployment needs TLS.
  # Caddy obtains and renews Let's Encrypt certificates automatically, which
  # is one fewer thing to remember in ninety days.
  #
  # Caddy is the ONLY service that publishes to the public interface. The api
  # and web ports are bound to 127.0.0.1 — reachable over an SSH tunnel during
  # setup, and by Caddy over the compose network, but not from the internet.
  #
  # An earlier version of this comment said to close 3000/3001 "in the host
  # firewall once Caddy is serving". That advice does not work: Docker's
  # iptables rules are traversed before ufw's, so a ufw rule cannot close a
  # Docker-published port. The binding itself has to be qualified.
  caddy:
    image: caddy:2-alpine
    container_name: trade-automation-caddy
    restart: unless-stopped
    profiles: ["public"]
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
